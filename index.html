<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Performance Evaluation System - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #F8FAFC;
            --secondary-bg: #DBEAFE;
            --accent-color: #2563EB;
            --accent-hover: #1D4ED8;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
            --success-color: #10B981;
            --error-color: #EF4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }

        .login-container {
            background: white;
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            margin: 1rem;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }

        select, input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }


        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .demo-credentials {
            margin-top: 1.5rem;
            padding: 1rem;
            background: var(--primary-bg);
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .demo-credentials h4 {
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .credential-item {
            margin-bottom: 0.25rem;
            color: var(--text-secondary);
        }

        .notification {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 1rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: var(--error-color);
        }

        .notification.success {
            background: var(--success-color);
        }

        @media (max-width: 640px) {
            .login-container {
                padding: 1.5rem;
                margin: 0.5rem;
            }


            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <div class="logo">EP</div>
            <h1>Performance Evaluation</h1>
            <p class="subtitle">Employee Performance Management System</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>

        <div class="demo-credentials">
            <h4>Demo Credentials:</h4>
            <div class="credential-item">admin/admin123 (Administrator)</div>
            <div class="credential-item">hr/hr123 (HR Officer)</div>
            <div class="credential-item">emp/emp123 (Employee)</div>
            <div class="credential-item">sup/sup123 (Supervisor)</div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
        // Authentication system using localStorage
        class AuthSystem {
            constructor() {
                this.credentials = {
                    administrator: { username: 'admin', password: 'admin123' },
                    hr: { username: 'hr', password: 'hr123' },
                    employee: { username: 'emp', password: 'emp123' },
                    supervisor: { username: 'sup', password: 'sup123' }
                };
                this.init();
            }

            init() {
                // Check if user is already logged in
                const currentUser = localStorage.getItem('currentUser');
                if (currentUser) {
                    this.redirectToDashboard(JSON.parse(currentUser));
                }

                this.setupEventListeners();
            }

            setupEventListeners() {
                // Form submission
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });
            }

            handleLogin() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                // Determine role based on credentials using if-else
                let role = null;
                if (username === 'admin' && password === 'admin123') {
                    role = 'administrator';
                } else if (username === 'hr' && password === 'hr123') {
                    role = 'hr';
                } else if (username === 'emp' && password === 'emp123') {
                    role = 'employee';
                } else if (username === 'sup' && password === 'sup123') {
                    role = 'supervisor';
                }

                if (role) {
                    const user = {
                        role: role,
                        username: username,
                        loginTime: new Date().toISOString()
                    };

                    // Store user session
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    
                    this.showNotification('Login successful! Redirecting...', 'success');
                    
                    // Redirect to appropriate dashboard
                    setTimeout(() => {
                        this.redirectToDashboard(user);
                    }, 1000);
                } else {
                    this.showNotification('Invalid credentials. Please try again.', 'error');
                }
            }

            redirectToDashboard(user) {
                const dashboardMap = {
                    administrator: 'admin/dashboard.html',
                    hr: 'hr/dashboard.html',
                    employee: 'employee/dashboard.html',
                    supervisor: 'supervisor/dashboard.html'
                };

                const dashboardUrl = dashboardMap[user.role];
                if (dashboardUrl) {
                    window.location.href = dashboardUrl;
                }
            }

            showNotification(message, type) {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${type} show`;

                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize the authentication system
        document.addEventListener('DOMContentLoaded', () => {
            new AuthSystem();
        });

        // Global logout function
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = '../index.html';
        }
    </script>
</body>
</html>
