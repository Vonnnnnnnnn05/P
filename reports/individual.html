<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report - Individual Summary</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --soft: #E0F2FE;
      --accent: #0EA5E9;
      --text: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: var(--soft); padding: 18px; }
    .sidebar h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .sidebar a {
      display: block;
      padding: 10px 12px;
      margin: 6px 0;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .sidebar a.active,
    .sidebar a:hover { background: #bae6fd; }
    .main { padding: 22px; }
    .card { background: #fff; padding: 16px; border-radius: 12px; max-width: 900px; }
    .btn {
      background: var(--accent);
      border: 0;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: flex; gap: 6px; overflow: auto; }
      .sidebar a { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Reports</h2>
      <nav>
        <a class="active" href="individual.html">Individual Summary</a>
        <a href="department.html">Department Overview</a>
        <a href="completion.html">Completion Status</a>
        <a href="trends.html">Trend Comparison</a>
        <a href="training.html">Training Needs</a>
        <a href="organization.html">Organizational</a>
        <a href="#" onclick="logout(); return false;">Logout</a>
      </nav>
    </aside>
    <main class="main">
      <h1>Individual Summary</h1>
      <div class="card">
        <p><strong>Employee:</strong> Maria Santos</p>
        <p><strong>Overall Score:</strong> 4.2 / 5</p>
        <p><strong>Strengths:</strong> Accuracy, teamwork</p>
        <p><strong>Improvement:</strong> Presentation confidence</p>
      </div>
    </main>
  </div>

  <script>
    const auth = JSON.parse(localStorage.getItem("epsAuth") || "null");
    if (!auth) location.href = "../index.html";
    function logout() {
      localStorage.removeItem("epsAuth");
      location.href = "../index.html";
    }
  </script>
</body>
</html>
