<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report - Trend Comparison</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --soft: #E0F2FE;
      --accent: #0EA5E9;
      --text: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: var(--soft); padding: 18px; }
    .sidebar h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .sidebar a {
      display: block;
      padding: 10px 12px;
      margin: 6px 0;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .sidebar a.active,
    .sidebar a:hover { background: #bae6fd; }
    .main { padding: 22px; }
    .card { background: #fff; padding: 16px; border-radius: 12px; max-width: 900px; }
    .bars .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }
    .bars span { display: inline-block; width: 70px; }
    .meter {
      height: 20px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      flex: 1;
    }
    .meter i {
      display: block;
      height: 100%;
      background: var(--accent);
      font-style: normal;
      color: #fff;
      padding-left: 8px;
      font-size: 12px;
      line-height: 20px;
    }
    .btn {
      background: var(--accent);
      border: 0;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: flex; gap: 6px; overflow: auto; }
      .sidebar a { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Reports</h2>
      <nav>
        <a href="individual.html">Individual Summary</a>
        <a href="department.html">Department Overview</a>
        <a href="completion.html">Completion Status</a>
        <a class="active" href="trends.html">Trend Comparison</a>
        <a href="training.html">Training Needs</a>
        <a href="organization.html">Organizational</a>
        <a href="#" onclick="logout(); return false;">Logout</a>
      </nav>
    </aside>
    <main class="main">
      <h1>Trend Comparison</h1>
      <div class="card">
        <div class="bars">
          <div class="row">
            <span>2023</span>
            <div class="meter"><i style="width: 76%">3.8</i></div>
          </div>
          <div class="row">
            <span>2024</span>
            <div class="meter"><i style="width: 82%">4.1</i></div>
          </div>
          <div class="row">
            <span>2025</span>
            <div class="meter"><i style="width: 86%">4.3</i></div>
          </div>
          <div class="row">
            <span>2026</span>
            <div class="meter"><i style="width: 84%">4.2</i></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const auth = JSON.parse(localStorage.getItem("epsAuth") || "null");
    if (!auth) location.href = "../index.html";
    function logout() {
      localStorage.removeItem("epsAuth");
      location.href = "../index.html";
    }
  </script>
</body>
</html>
