<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervisor - Comments</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --soft: #DBEAFE;
      --accent: #2563EB;
      --text: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    .sidebar { background: var(--soft); padding: 18px; }
    .sidebar h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .sidebar a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      margin: 6px 0;
    }
    .sidebar a.active,
    .sidebar a:hover { background: #bfdbfe; }
    .main { padding: 22px; }
    .card {
      max-width: 840px;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    .btn {
      background: var(--accent);
      border: 0;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    ul { padding-left: 18px; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: flex; gap: 6px; overflow: auto; }
      .sidebar a { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Supervisor</h2>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="evaluations.html">Evaluate Employees</a>
        <a href="rate.html">Rate Criteria</a>
        <a class="active" href="comments.html">Comments</a>
        <a href="recommendations.html">Recommendations</a>
        <a href="#" onclick="logout(); return false;">Logout</a>
      </nav>
    </aside>
    <main class="main">
      <h1>Evaluation Comments</h1>
      <div class="card">
        <textarea id="comment" rows="5" placeholder="Write feedback comments..."></textarea>
        <br /><br />
        <button class="btn" onclick="addComment()">Add Comment</button>
        <h4>Saved Comments</h4>
        <ul id="list">
          <li>Consistently meets deadlines and supports team members.</li>
        </ul>
      </div>
    </main>
  </div>

  <script>
    const auth = JSON.parse(localStorage.getItem("epsAuth") || "null");
    if (!auth || auth.role !== "Supervisor") location.href = "../index.html";
    function addComment() {
      const v = comment.value.trim();
      if (!v) {
        alert("Write a comment first.");
        return;
      }
      list.insertAdjacentHTML("beforeend", `<li>${v}</li>`);
      comment.value = "";
      alert("Comment added.");
    }
    function logout() {
      localStorage.removeItem("epsAuth");
      location.href = "../index.html";
    }
  </script>
</body>
</html>
