<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervisor - Rate Criteria</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --soft: #DBEAFE;
      --accent: #2563EB;
      --text: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .layout { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    .sidebar { background: var(--soft); padding: 18px; }
    .sidebar h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .sidebar a {
      display: block;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      margin: 6px 0;
    }
    .sidebar a.active,
    .sidebar a:hover { background: #bfdbfe; }
    .main { padding: 22px; }
    .card {
      max-width: 820px;
      background: #fff;
      padding: 16px;
      border-radius: 12px;
    }
    label { display: block; margin: 8px 0; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    .btn {
      background: var(--accent);
      border: 0;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }
    .score { font-weight: 700; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: flex; gap: 6px; overflow: auto; }
      .sidebar a { white-space: nowrap; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Supervisor</h2>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="evaluations.html">Evaluate Employees</a>
        <a class="active" href="rate.html">Rate Criteria</a>
        <a href="comments.html">Comments</a>
        <a href="recommendations.html">Recommendations</a>
        <a href="#" onclick="logout(); return false;">Logout</a>
      </nav>
    </aside>
    <main class="main">
      <h1>Rate Using Criteria</h1>
      <div class="card">
        <label>Quality of Work (1-5)<input id="a" type="number" min="1" max="5" value="4" /></label>
        <label>Productivity (1-5)<input id="b" type="number" min="1" max="5" value="4" /></label>
        <label>Teamwork (1-5)<input id="c" type="number" min="1" max="5" value="5" /></label>
        <label>Initiative (1-5)<input id="d" type="number" min="1" max="5" value="4" /></label>
        <p class="score">Computed Score: <span id="score">4.25</span> / 5</p>
        <button class="btn" onclick="submitRate()">Submit Rating</button>
      </div>
    </main>
  </div>

  <script>
    const auth = JSON.parse(localStorage.getItem("epsAuth") || "null");
    if (!auth || auth.role !== "Supervisor") location.href = "../index.html";
    [a, b, c, d].forEach((i) => i.addEventListener("input", calc));
    function calc() {
      score.textContent = (
        [a, b, c, d].reduce((t, n) => t + (Number(n.value) || 0), 0) / 4
      ).toFixed(2);
    }
    function submitRate() {
      alert(`Rating submitted. Auto score: ${score.textContent}`);
    }
    function logout() {
      localStorage.removeItem("epsAuth");
      location.href = "../index.html";
    }
  </script>
</body>
</html>
